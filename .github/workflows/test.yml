name: Offline contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  powershell-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_target_lock.py -v
      - name: Test independent SES files on Windows
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p 'test_ses*.py' -v
      - name: Parse native helpers and run synthetic readers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scripts=Join-Path $PWD 'skills/digico-native-session/scripts'
          $skillRoot=Split-Path $scripts -Parent
          Get-ChildItem "$scripts/*.ps1" | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw ($parseErrors | Out-String)}
          }
          & ./tests/native_status_parser_tests.ps1 -StatusModulePath "$scripts/native_status.ps1"
          & ./tests/native_transfer_parser_tests.ps1 -TransferModulePath "$scripts/native_transfer.ps1"
          & ./tests/native_presets_readback_tests.ps1 -PresetModulePath "$scripts/native_presets.ps1"
          & ./tests/native_preset_adapter_tests.ps1 -AdapterModulePath "$scripts/native_preset_adapter.ps1" -PresetModulePath "$scripts/native_presets.ps1"
          & ./tests/native_structure_readback_tests.ps1 -StructureModulePath "$scripts/native_structure.ps1"
          & ./tests/native_endpoint_parser_tests.ps1 -EndpointModulePath "$scripts/native_endpoint.ps1"
          # Reproduce the redirected-stdin encoding used by GitHub's shell.
          $endpointInputEncoding=[Console]::InputEncoding
          try {
            [Console]::InputEncoding=[Text.UTF8Encoding]::new($true)
            & ./tests/native_endpoint_owner_tests.ps1 -EndpointModulePath "$scripts/native_endpoint.ps1"
          } finally {
            [Console]::InputEncoding=$endpointInputEncoding
          }
          & ./tests/native_profile_tests.ps1 -ProfileModulePath "$scripts/native_profile.ps1"
          & ./tests/native_control_allowlist_tests.ps1 -ProfileModulePath "$scripts/native_profile.ps1" -ControlModulePath "$scripts/native_controls.ps1"
          & ./tests/native_journal_tests.ps1 -JournalModulePath "$scripts/native_journal.ps1"
          & ./tests/native_state_retry_tests.ps1 -RunnerPath "$scripts/windows_native.ps1"
          & ./tests/native_session_file_identity_tests.ps1 -RunnerPath "$scripts/windows_native.ps1" -OldProfilePath "$skillRoot/assets/build-profiles/quantum1-v2126.json"
          & ./tests/native_inventory_definition_tests.ps1 -SkillRoot "$skillRoot" -ProfileModulePath "$scripts/native_profile.ps1" -InventoryModulePath "$scripts/native_inventory.ps1"
          & ./tests/native_lease_tests.ps1 -LeaseModulePath "$scripts/native_lease.ps1"
          & ./tests/native_mirror_oracle_tests.ps1 -OracleModulePath "$scripts/native_mirror_oracle.ps1"
